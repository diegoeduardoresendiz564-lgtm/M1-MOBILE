
name: Build M1 Mobile

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q M1Mobile-source.zip -d project

      - name: Fix MIDI imports
        run: |
          sed -i 's/android\.hardware\.midi/android.media.midi/g' project/app/src/main/java/com/example/m1mobile/MainActivity.kt

      - name: Fix audio library
        run: |
          echo 'target_link_libraries(m1mobile OpenSLES)' >> project/app/src/main/cpp/CMakeLists.txt

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""", 1)
          else:
              s = re.sub(r'sourceCompatibility\s*=\s*[^\n]+',
                         'sourceCompatibility = JavaVersion.VERSION_17', s)
              s = re.sub(r'targetCompatibility\s*=\s*[^\n]+',
                         'targetCompatibility = JavaVersion.VERSION_17', s)

          if "kotlinOptions {" not in s:
              s = s.replace("android {", """android {
              kotlinOptions {
                  jvmTarget = "17"
              }""", 1)
          else:
              s = re.sub(r'jvmTarget\s*=\s*["\'][^"\']+["\']',
                         'jvmTarget = "17"', s)

          p.write_text(s)
          PY

      - name: Compile APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M1Mobile-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
